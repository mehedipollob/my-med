<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0ea5a4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>MyMed — Personal Medicine Manager</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ SVG ICON SPRITE ============ -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-pill" viewBox="0 0 24 24"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5"/><path d="M12 8.5v7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20h18"/><rect x="5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="6" width="3" height="11" rx="1"/><rect x="16" y="13" width="3" height="4" rx="1"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></symbol>
  <symbol id="i-backspace" viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="m18 9-6 6M12 9l6 6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol>
</svg>

<!-- ============ LOCK SCREEN ============ -->
<div id="lockScreen" class="lock-screen hidden">
  <div class="lock-inner">
    <div class="lock-logo"><svg class="ic ic-lg"><use href="#i-lock"/></svg></div>
    <h1 class="lock-title">MyMed</h1>
    <p class="lock-sub" id="lockMsg">Enter your 4-digit PIN</p>
    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="pin-pad" id="pinPad">
      <button class="pin-key" data-key="1">1</button>
      <button class="pin-key" data-key="2">2</button>
      <button class="pin-key" data-key="3">3</button>
      <button class="pin-key" data-key="4">4</button>
      <button class="pin-key" data-key="5">5</button>
      <button class="pin-key" data-key="6">6</button>
      <button class="pin-key" data-key="7">7</button>
      <button class="pin-key" data-key="8">8</button>
      <button class="pin-key" data-key="9">9</button>
      <button class="pin-key pin-key-ghost" id="bioKey" data-key="bio" hidden><svg class="ic"><use href="#i-shield"/></svg></button>
      <button class="pin-key" data-key="0">0</button>
      <button class="pin-key pin-key-ghost" data-key="del"><svg class="ic"><use href="#i-backspace"/></svg></button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">

  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn hidden" id="backBtn" aria-label="Back"><svg class="ic"><use href="#i-arrow-left"/></svg></button>
      <div class="header-titles">
        <h1 id="headerTitle">MyMed</h1>
        <p id="headerSub" class="header-sub"></p>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="headerLockBtn" title="Lock app" hidden><svg class="ic"><use href="#i-lock"/></svg></button>
    </div>
  </header>

  <main id="main" class="main">

    <!-- ============ HOME ============ -->
    <section id="screen-home" class="screen active">
      <div class="card hero-card">
        <div class="hero-top">
          <div class="hero-text">
            <p class="hero-date" id="homeDate">—</p>
            <h2 class="hero-title">Today's Progress</h2>
          </div>
          <div class="ring-wrap">
            <svg class="ring-svg" viewBox="0 0 36 36">
              <path class="ring-bg" stroke-dasharray="100,100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
              <path class="ring-fg" id="ringFg" stroke-dasharray="0,100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            </svg>
            <span class="ring-label" id="ringLabel">0%</span>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat"><span class="stat-val" id="statScheduled">0</span><span class="stat-lbl">Scheduled</span></div>
          <div class="stat stat-ok"><span class="stat-val" id="statTaken">0</span><span class="stat-lbl">Taken</span></div>
          <div class="stat stat-blue"><span class="stat-val" id="statUpcoming">0</span><span class="stat-lbl">Upcoming</span></div>
          <div class="stat stat-bad"><span class="stat-val" id="statMissed">0</span><span class="stat-lbl">Missed</span></div>
        </div>
      </div>

      <div class="card next-card" id="nextCard">
        <div class="next-icon"><svg class="ic"><use href="#i-bell"/></svg></div>
        <div class="next-body">
          <p class="next-label">Next reminder</p>
          <p class="next-title" id="nextTitle">No upcoming doses</p>
          <p class="next-sub" id="nextSub">You're all caught up</p>
        </div>
      </div>

      <div class="section-head">
        <h3>Today's Medicines</h3>
        <button class="link-btn" data-goto="timetable">Timetable</button>
      </div>
      <div id="todayList" class="dose-list"></div>

      <div class="quick-grid">
        <button class="quick-tile" data-goto="calendar">
          <svg class="ic"><use href="#i-calendar"/></svg><span>Calendar</span>
        </button>
        <button class="quick-tile" data-goto="stock">
          <svg class="ic"><use href="#i-box"/></svg><span>Stock</span>
        </button>
        <button class="quick-tile" data-goto="reports">
          <svg class="ic"><use href="#i-chart"/></svg><span>Reports</span>
        </button>
        <button class="quick-tile" data-goto="medicine-form">
          <svg class="ic"><use href="#i-plus"/></svg><span>Add Med</span>
        </button>
      </div>
    </section>

    <!-- ============ MEDICINES ============ -->
    <section id="screen-medicines" class="screen">
      <div class="search-bar">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="medSearch" type="search" placeholder="Search medicines" autocomplete="off" />
      </div>
      <div class="chips" id="medFilters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="active">Active</button>
        <button class="chip" data-filter="paused">Paused</button>
        <button class="chip" data-filter="low">Low stock</button>
      </div>
      <div id="medicineList" class="med-list"></div>
    </section>

    <!-- ============ ADD / EDIT MEDICINE ============ -->
    <section id="screen-medicine-form" class="screen">
      <form id="medicineForm" class="form" autocomplete="off" novalidate>
        <input type="hidden" id="fId" />

        <div class="card">
          <div class="field">
            <label for="fName">Medicine name <span class="req">*</span></label>
            <input id="fName" type="text" maxlength="80" placeholder="e.g. Amoxicillin" required />
          </div>
          <div class="row2">
            <div class="field">
              <label for="fType">Type</label>
              <select id="fType">
                <option>Tablet</option><option>Capsule</option><option>Syrup</option>
                <option>Injection</option><option>Drops</option><option>Inhaler</option>
                <option>Ointment</option><option>Powder</option><option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="fStrength">Strength</label>
              <input id="fStrength" type="text" maxlength="30" placeholder="500 mg" />
            </div>
          </div>
          <div class="field">
            <label for="fDosage">Dosage per intake</label>
            <input id="fDosage" type="text" maxlength="40" placeholder="1 tablet" />
          </div>
          <div class="row2">
            <div class="field">
              <label for="fStart">Start date <span class="req">*</span></label>
              <input id="fStart" type="date" required />
            </div>
            <div class="field">
              <label for="fEnd">End date</label>
              <input id="fEnd" type="date" />
            </div>
          </div>
          <div class="field">
            <label>Food instruction</label>
            <div class="segmented" id="fFood">
              <button type="button" data-val="before">Before food</button>
              <button type="button" data-val="after" class="active">After food</button>
              <button type="button" data-val="with">With food</button>
              <button type="button" data-val="none">No rule</button>
            </div>
          </div>
          <div class="field">
            <label for="fNotes">Instructions / notes</label>
            <textarea id="fNotes" rows="2" maxlength="200" placeholder="e.g. Take with a full glass of water"></textarea>
          </div>
          <div class="field">
            <label>Prescription image</label>
            <div class="image-upload">
              <input type="file" id="fImage" accept="image/*" hidden />
              <button type="button" class="btn ghost small" id="pickImage">
                <svg class="ic"><use href="#i-camera"/></svg> Upload / Capture
              </button>
              <div id="imagePreview" class="image-preview hidden">
                <img id="imagePreviewImg" alt="Prescription preview" />
                <button type="button" class="icon-btn danger" id="removeImage"><svg class="ic"><use href="#i-x"/></svg></button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="section-head"><h3>Schedule</h3></div>
          <div class="field">
            <label>Repeat days</label>
            <div class="days-row" id="fDays">
              <button type="button" class="day-chip" data-day="1">M</button>
              <button type="button" class="day-chip" data-day="2">T</button>
              <button type="button" class="day-chip" data-day="3">W</button>
              <button type="button" class="day-chip" data-day="4">T</button>
              <button type="button" class="day-chip" data-day="5">F</button>
              <button type="button" class="day-chip" data-day="6">S</button>
              <button type="button" class="day-chip" data-day="0">S</button>
            </div>
            <label class="switch-row">
              <span>Every day</span>
              <input type="checkbox" id="fDaily" checked />
              <i class="switch"></i>
            </label>
          </div>
          <div class="field">
            <label>Reminder times</label>
            <div id="timeList" class="time-list"></div>
            <button type="button" class="btn ghost small" id="addTimeBtn">
              <svg class="ic"><use href="#i-plus"/></svg> Add time
            </button>
          </div>
        </div>

        <div class="card">
          <label class="switch-row">
            <span>Track stock</span>
            <input type="checkbox" id="fStockEnabled" />
            <i class="switch"></i>
          </label>
          <div id="stockFields" class="hidden">
            <div class="row2">
              <div class="field">
                <label for="fStockInitial">Initial stock</label>
                <input id="fStockInitial" type="number" min="0" step="1" value="30" inputmode="numeric" />
              </div>
              <div class="field">
                <label for="fStockThreshold">Low stock alert at</label>
                <input id="fStockThreshold" type="number" min="0" step="1" value="5" inputmode="numeric" />
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn ghost" id="cancelFormBtn">Cancel</button>
          <button type="submit" class="btn primary">Save medicine</button>
        </div>
      </form>
    </section>

    <!-- ============ MEDICINE DETAIL ============ -->
    <section id="screen-medicine-detail" class="screen">
      <div id="medicineDetail"></div>
    </section>

    <!-- ============ TIMETABLE ============ -->
    <section id="screen-timetable" class="screen">
      <div class="weekday-row" id="weekdayRow">
        <button class="wd-chip" data-day="1">Mon</button>
        <button class="wd-chip" data-day="2">Tue</button>
        <button class="wd-chip" data-day="3">Wed</button>
        <button class="wd-chip" data-day="4">Thu</button>
        <button class="wd-chip" data-day="5">Fri</button>
        <button class="wd-chip" data-day="6">Sat</button>
        <button class="wd-chip" data-day="0">Sun</button>
      </div>
      <div id="timetableBody"></div>
    </section>

    <!-- ============ CALENDAR ============ -->
    <section id="screen-calendar" class="screen">
      <div class="cal-head">
        <button class="icon-btn" id="calPrev"><svg class="ic"><use href="#i-chevron-left"/></svg></button>
        <h3 id="calTitle">—</h3>
        <button class="icon-btn" id="calNext"><svg class="ic"><use href="#i-chevron-right"/></svg></button>
      </div>
      <div class="cal-weekdays">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span><i class="dot ok"></i>All taken</span>
        <span><i class="dot part"></i>Partial</span>
        <span><i class="dot bad"></i>Missed</span>
      </div>
      <div class="section-head"><h3 id="calDayTitle">Selected day</h3></div>
      <div id="calDayList" class="dose-list"></div>
    </section>

    <!-- ============ REPORTS ============ -->
    <section id="screen-reports" class="screen">
      <div class="chips" id="reportTabs">
        <button class="chip active" data-period="daily">Daily</button>
        <button class="chip" data-period="weekly">Weekly</button>
        <button class="chip" data-period="monthly">Monthly</button>
      </div>
      <div id="reportBody"></div>
    </section>

    <!-- ============ STOCK ============ -->
    <section id="screen-stock" class="screen">
      <div id="stockBody"></div>
    </section>

    <!-- ============ SETTINGS ============ -->
    <section id="screen-settings" class="screen">
      <div id="settingsBody"></div>
    </section>

  </main>

  <button class="fab" id="fab" aria-label="Add medicine"><svg class="ic"><use href="#i-plus"/></svg></button>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></button>
    <button class="nav-btn" data-nav="medicines"><svg class="ic"><use href="#i-pill"/></svg><span>Medicines</span></button>
    <button class="nav-btn" data-nav="timetable"><svg class="ic"><use href="#i-clock"/></svg><span>Timetable</span></button>
    <button class="nav-btn" data-nav="reports"><svg class="ic"><use href="#i-chart"/></svg><span>Reports</span></button>
    <button class="nav-btn" data-nav="settings"><svg class="ic"><use href="#i-settings"/></svg><span>Settings</span></button>
  </nav>
</div>

<div id="toast" class="toast"></div>
<div id="modalRoot" class="modal-root"></div>

<script src="script.js"></script>
</body>
                                                  </html>
